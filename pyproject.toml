[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "movie-persona-chat"
version = "0.1.0"
description = "LoRA movie-persona chat with classifier reranking and neural TTS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=0.30.0",
    "edge-tts>=7.0.0",
    "fastapi>=0.111.0",
    "numpy>=1.26.0",
    "peft>=0.11.0",
    "protobuf>=4.25.0",
    "pydantic>=2.0",
    "safetensors>=0.4.0",
    "sentencepiece>=0.2.0",
    "torch>=2.2.0",
    "transformers>=4.45.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
training = [
    "anthropic>=0.28.0",
    "datasets>=2.20.0",
    "matplotlib>=3.8.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "scikit-learn>=1.4.0",
    "seaborn>=0.13.0",
    "tokenizers>=0.19.0",
]
deployment = ["modal>=1.0.0"]

[project.scripts]
movie-persona = "movie_persona.pipeline:main"
movie-persona-api = "movie_persona.api:main"

[tool.setuptools.packages.find]
where = ["src"]
