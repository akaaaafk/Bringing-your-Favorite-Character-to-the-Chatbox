
[project]

name = "persona-classifier"

version = "0.1.0"

description = "Phase 1: Data prep + persona classifier for the Persona Voice Studio project"

requires-python = ">=3.10"

dependencies = [

    "pandas>=2.2",

    "requests>=2.32",

    "scikit-learn>=1.5",

    "torch>=2.3",

    "transformers>=4.44",

    "datasets>=2.20",

    "matplotlib>=3.9",

    "seaborn>=0.13",

    "anthropic>=0.34",

    "python-dotenv>=1.0",

    "accelerate>=1.1.0",

]

[build-system]

requires = ["hatchling"]

build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]

packages = ["scripts"]

